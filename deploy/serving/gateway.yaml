apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: gpu-sim-envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gpu-sim-gateway
  namespace: kserve
spec:
  gatewayClassName: gpu-sim-envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
