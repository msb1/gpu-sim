data:
  controller_manager_config.yaml: |
    apiVersion: config.kueue.x-k8s.io/v1beta1
    kind: Configuration
    webhook:
      port: 9443
    health:
      healthProbeBindAddress: :8081
    metrics:
      bindAddress: :8080
    manageJobsWithoutQueueName: false
    managedJobsNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: gpu-serving
    integrations:
      frameworks:
        - pod
