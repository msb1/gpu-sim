apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-simulator-engine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gpu-simulator-engine
  template:
    metadata:
      labels:
        app: gpu-simulator-engine
    spec:
      serviceAccountName: gpu-sim-observer
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: simulator
          image: gpu-simulator:kind
          imagePullPolicy: Never
          ports:
            - {name: control, containerPort: 8080}
            - {name: dcgm, containerPort: 9400}
            - {name: serving, containerPort: 8002}
          readinessProbe:
            httpGet: {path: /state, port: control}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /state, port: control}
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-simulator-svc
spec:
  type: NodePort
  selector:
    app: gpu-simulator-engine
  ports:
    - {name: control, port: 8080, targetPort: control, nodePort: 30080}
    - {name: dcgm, port: 9400, targetPort: dcgm, nodePort: 30094}
    - {name: serving, port: 8002, targetPort: serving, nodePort: 30082}
