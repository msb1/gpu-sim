kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 0.0.0.0
        protocol: TCP
      - containerPort: 30094
        hostPort: 9400
        listenAddress: 0.0.0.0
        protocol: TCP
      - containerPort: 30082
        hostPort: 8002
        listenAddress: 0.0.0.0
        protocol: TCP
